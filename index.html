<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Indian Listed Company Logos - NSE & BSE SVG Directory</title>
    <meta
      name="description"
      content="Search and download SVG, PNG, and JPG logos for Indian listed companies on NSE and BSE, with sector, industry, ISIN, market-cap, and index membership metadata."
    />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <link rel="canonical" href="https://dharunashokkumar.github.io/indian-listed-company-logos/" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Indian Listed Company Logos" />
    <meta
      property="og:description"
      content="A searchable NSE and BSE logo index with bulk SVG, PNG, and JPG downloads."
    />
    <meta property="og:url" content="https://dharunashokkumar.github.io/indian-listed-company-logos/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#171512" />
    <link rel="manifest" href="site.webmanifest" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="preload" href="data/logos.json" as="fetch" crossorigin="anonymous" />
    <link rel="stylesheet" href="styles.css" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Dataset",
        "name": "Indian Listed Company Logos",
        "description": "Searchable logo and metadata directory for NSE and BSE listed companies.",
        "url": "https://dharunashokkumar.github.io/indian-listed-company-logos/",
        "keywords": [
          "NSE logos",
          "BSE logos",
          "Indian stock market logos",
          "listed company logos",
          "SVG logos"
        ],
        "creator": {
          "@type": "Person",
          "name": "Dharun Ashok Kumar"
        },
        "distribution": {
          "@type": "DataDownload",
          "encodingFormat": "application/json",
          "contentUrl": "https://dharunashokkumar.github.io/indian-listed-company-logos/data/logos.json"
        }
      }
    </script>
  </head>
  <body>
    <a class="skip-link" href="#results">Skip to results</a>

    <header class="masthead">
      <div class="masthead__copy">
        <p class="kicker">NSE / BSE mark index</p>
        <h1>Indian Listed Company Logos</h1>
      </div>
      <dl class="stat-strip" aria-label="Dataset counts">
        <div>
          <dt>Logos</dt>
          <dd id="statTotal">3156</dd>
        </div>
        <div>
          <dt>NSE</dt>
          <dd id="statNse">2468</dd>
        </div>
        <div>
          <dt>BSE</dt>
          <dd id="statBse">688</dd>
        </div>
      </dl>
    </header>

    <main class="workspace">
      <section class="control-room" aria-label="Logo search and filters">
        <div class="search-block">
          <label class="search-label" for="searchInput">Search</label>
          <div class="search-line">
            <input
              id="searchInput"
              type="search"
              autocomplete="off"
              spellcheck="false"
              placeholder="Ticker, company, ISIN"
            />
            <button id="clearSearch" type="button">Clear</button>
          </div>
        </div>

        <div class="filters">
          <label>
            Exchange
            <select id="exchangeFilter">
              <option value="all">All</option>
              <option value="NSE">NSE</option>
              <option value="BSE">BSE</option>
            </select>
          </label>

          <label>
            Sector
            <select id="sectorFilter">
              <option value="all">All sectors</option>
            </select>
          </label>

          <label>
            Index
            <select id="indexFilter">
              <option value="all">All companies</option>
              <option value="constituents">Any index constituent</option>
            </select>
          </label>

          <label>
            Sort
            <select id="sortSelect">
              <option value="relevance">Relevance</option>
              <option value="marketCapDesc">Market cap high to low</option>
              <option value="marketCapAsc">Market cap low to high</option>
              <option value="tickerAsc">Ticker A to Z</option>
              <option value="companyAsc">Company A to Z</option>
              <option value="sectorAsc">Sector A to Z</option>
            </select>
          </label>
        </div>
      </section>

      <section class="download-room" aria-label="Download settings">
        <fieldset class="segment-field">
          <legend>Format</legend>
          <label><input type="radio" name="format" value="svg" checked /> SVG</label>
          <label><input type="radio" name="format" value="png" /> PNG</label>
          <label><input type="radio" name="format" value="jpg" /> JPG</label>
        </fieldset>

        <label>
          Scale
          <select id="scaleSelect">
            <option value="1">1x</option>
            <option value="2" selected>2x</option>
            <option value="3">3x</option>
            <option value="4">4x</option>
          </select>
        </label>

        <label class="quality-control">
          JPG quality
          <input id="qualityInput" type="range" min="60" max="100" value="92" />
          <span id="qualityValue">92</span>
        </label>

        <button id="downloadSelected" type="button">Download selected</button>
        <button id="downloadResults" type="button">Download results</button>
      </section>

      <section class="result-bar" aria-label="Result actions">
        <p>
          <strong id="resultCount">0</strong>
          <span>shown</span>
          <span class="dot"></span>
          <strong id="selectedCount">0</strong>
          <span>selected</span>
        </p>
        <div class="result-actions">
          <button id="selectVisible" type="button">Select visible</button>
          <button id="clearSelected" type="button">Clear selected</button>
        </div>
      </section>

      <section id="results" class="logo-grid" aria-live="polite"></section>

      <div class="load-row">
        <button id="loadMore" type="button">Load more</button>
      </div>
    </main>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <template id="logoCardTemplate">
      <article class="logo-card">
        <label class="check-pin">
          <input type="checkbox" />
          <span>Select</span>
        </label>
        <div class="logo-stage">
          <img alt="" loading="lazy" decoding="async" />
        </div>
        <div class="logo-copy">
          <div class="ticker-row">
            <span class="exchange"></span>
            <h2></h2>
          </div>
          <p class="company"></p>
          <p class="industry"></p>
        </div>
        <dl class="meta-row">
          <div>
            <dt>Sector</dt>
            <dd class="sector"></dd>
          </div>
          <div>
            <dt>ISIN</dt>
            <dd class="isin"></dd>
          </div>
          <div>
            <dt>Market cap</dt>
            <dd class="market-cap"></dd>
          </div>
        </dl>
        <div class="card-actions">
          <button type="button" data-action="download">Download</button>
          <a target="_blank" rel="noreferrer">Open SVG</a>
        </div>
      </article>
    </template>

    <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js" defer></script>
    <script src="analytics.js" defer></script>
    <script src="app.js" defer></script>
  </body>
</html>
